name: Daily poster

on:
  schedule:
    # 17:15 UTC daily — spaced apart from the blog-share post.
    - cron: "15 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the poster but do not upload or post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-poster
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-save satori@0.26.0 @resvg/resvg-js@2.6.2 qrcode@1.5.4

      - name: Generate and post today's poster
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          npm run poster:generate -- $ARGS

      - name: Commit poster history
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/poster-history.json
          git diff --cached --quiet || git commit -m "content: daily poster for $(date -u +%Y-%m-%d)"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
